<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GFC Financial Assistant</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>🤖 GFC Financial Assistant</h3>
        </div>
        
        <div id="chatBox" class="chat-box">
            <div class="msg bot">Hello! Ask me about Apple, Microsoft, or Tesla financial metrics.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your query here...">
            <button type="button" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user">${query}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await res.json();
                chatBox.innerHTML += `<div class="msg bot">${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg error">Connection error with server.</div>`;
            }
        }
    </script>
</body>
</html>
